<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .block{
            background-color: aqua;
            width:200px;
        }
        .inline{
            background-color: brown;
        }
        .inline-block{
            width: 200px;
        }
        .div-inline{
            display: inline-block;
            background-color: aquamarine;
        }
        .span-inline-block{
            display: inline-block;
            background-color: blueviolet;
            widtn: 300px;
        }
    </style>>
</head>
<body>
    <h1 style="font:bolder 50px 'KaiTi';">这是一个font 复合属性实例</h1>
    <p style="line-height: 40px;">这是一段长文本</p>
    <div class="block">这是一个块级元素</div>
    <span class="inline">这是一个行内元素</span>
    <img src="./2、图片.png" alt="" class="inline-block">

    <h2>display</h2>
    <!-- <div style="display: inline; background-color:aquamarine">这是一个转化成行内元素的div标签</div>  -->
    <div class="div-inline">这也是一个转化成行内块元素的div标签</div>
    <span class="span-inline-block">这是一个转化成行内块元素的span标签</span>
</body>
</html>
