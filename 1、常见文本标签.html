<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 练习</title>
</head>
<body>
    <h1>一级标题标签</h1>
    <h2>二级标题标签</h2>
    <h3>三级标题标签</h3>
    <h4>四级标题标签</h4>
    <h5>五级标题标签</h5>
    <h6>六级标题标签</h6>
    <p>段落标签</p>
    <p>更改文本样式：<b>字体加粗</b>、<i>字体斜体</i>、<u>字体下划线</u>、<s>字体删除线</s></p>
    <ul>
        <li>无序列表项 1</li>
        <li>无序列表项 2</li>
        <li>无序列表项 3</li>
    </ul>
    <ol>
        <li>有序列表项 1</li>
        <li>有序列表项 2</li>
        <li>有序列表项 3</li>
    </ol>
    <table border="1">
        <tr>
            <th>列标题 1</th>
            <th>列标题 2</th>
        </tr>
        <tr>
            <td>表格单元格 1</td>
            <td>表格单元格 2</td>
        </tr>
        <tr>
            <td>表格单元格 2_1</td>
            <td>表格单元格 2_2</td>
        </tr>
    </table>
</body>
</html>
