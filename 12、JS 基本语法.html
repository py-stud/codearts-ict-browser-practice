<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x;
        let y = 5;
        const  PI = 3.14;
        console.log(x, y, PI);
        let name = "如花";
        console.log(name);
        let empty = null;
        console.log(empty);

        let age = 18;

        if(age >= 18){
            console.log("你已经成年了");
        }else{
            console.log("你还没有成年");
        }

        let time = 10;
        if(time < 12){
            alert("上午好");
        }else if(time < 18){
            alert("下午好");
        }else{
            alert("晚上好");
        }

        console.log("for循环");
        for(let i = 0; i < 5; i++){
            console.log(i);
        }

        console.log("while循环");
        let i = 0;
        while(i < 5){
            console.log(i);
            i++;
        }

        console.log("循环关键字")
    </script>
</body>
</html>
